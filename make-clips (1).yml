name: Make clips

# Run from the Actions tab: paste a video link, pick a caption style, get the clips as a download.
# Note: YouTube usually blocks GitHub's servers. For YouTube videos, use "Clip uploaded video"
# (attach the file to a release) instead.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video link"
        required: true
      clips:
        description: "How many clips"
        default: "4"
      layout:
        description: "Framing"
        type: choice
        options: [face, center, blur]
        default: face
      font:
        description: "Caption font"
        type: choice
        options: [classic, montserrat, anton, bangers, poppins, bebas, marker]
        default: classic
      text_color:
        description: "Text colour (name like white, or #RRGGBB)"
        default: "white"
      highlight_color:
        description: "Spoken-word colour (name or #RRGGBB)"
        default: "yellow"
      background_color:
        description: "Box behind captions (none, a name, or #RRGGBB)"
        default: "none"
      size:
        description: "Caption size"
        type: choice
        options: [small, medium, large]
        default: medium
      position:
        description: "Caption position"
        type: choice
        options: [lower, middle]
        default: lower
      model:
        description: "Speech model (tiny/base/small/medium)"
        default: "small"

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg + fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ inputs.model }}

      - name: Make clips
        env:
          # Optional: add these under Settings > Secrets and variables > Actions
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # passed via env (not pasted into the script) so a link can't inject shell commands
          URL: ${{ inputs.url }}
          CLIPS: ${{ inputs.clips }}
          LAYOUT: ${{ inputs.layout }}
          MODEL: ${{ inputs.model }}
          FONT: ${{ inputs.font }}
          TEXT: ${{ inputs.text_color }}
          HIGH: ${{ inputs.highlight_color }}
          BG: ${{ inputs.background_color }}
          SIZE: ${{ inputs.size }}
          POS: ${{ inputs.position }}
        run: |
          python clipper.py "$URL" --clips "$CLIPS" --layout "$LAYOUT" --model "$MODEL" \
            --font "Liberation Sans" --caption-font "$FONT" --text-color "$TEXT" \
            --highlight-color "$HIGH" --background-color "$BG" \
            --caption-size "$SIZE" --caption-position "$POS"

      - name: Upload clips
        uses: actions/upload-artifact@v4
        with:
          name: clips
          path: |
            clips/**/*.mp4
            clips/**/clips.json
