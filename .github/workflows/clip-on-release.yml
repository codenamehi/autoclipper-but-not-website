name: Clip uploaded video

# Make a new release, attach your video, publish. Clips are attached to the same release.
# Optional: write settings in the release description, one per line, e.g.
#   clips: 6
#   font: montserrat
#   highlight: cyan
#   background: red
# See README "Caption styles" for every option.

on:
  release:
    types: [published]
  # "Run workflow" button: clip an existing release again (e.g. with the newest code)
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to clip again (e.g. video1)"
        required: true

permissions:
  contents: write

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg + fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Read the settings in the release description
        run: |
          eof="END_$(openssl rand -hex 8)"
          {
            echo "SETTINGS<<$eof"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.body // ""'
            echo "$eof"
          } >> "$GITHUB_ENV"

      - name: Download the video(s) you attached
        run: |
          mkdir -p input
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir input \
            --pattern "*.mp4" --pattern "*.MP4" --pattern "*.mov" --pattern "*.MOV" \
            --pattern "*.mkv" --pattern "*.webm" --pattern "*.m4v"
          # don't re-clip clips from an earlier run of this release
          find input -name "*_clip_*" -delete
          ls -la input

      - name: Make clips
        env:
          # AI picks the moments when one of these is set under
          # Settings > Secrets and variables > Actions (otherwise the free built-in picker is used)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          for f in input/*; do
            python clipper.py "$f" --font "Liberation Sans" --settings="$SETTINGS"
          done

      - name: Attach clips to the release
        run: |
          mkdir -p upload
          for d in clips/*/; do
            n=$(basename "$d")
            for c in "$d"clip_*.mp4; do cp "$c" "upload/${n}_$(basename "$c")"; done
          done
          gh release upload "$TAG" upload/*.mp4 --repo "$GITHUB_REPOSITORY" --clobber
